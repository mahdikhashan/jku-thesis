<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7078"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font-size: 20px; font-weight: 700; fill: #2b2f36; text-anchor: middle; }
      .sub { font-size: 12.5px; fill: #6b7078; text-anchor: middle; }
      .lane { fill: #f7f8f9; stroke: #c3c7cd; stroke-width: 1.2; }
      .gray { fill: #eceef1; stroke: #8a8f98; stroke-width: 1.2; }
      .plain { fill: #ffffff; stroke: #8a8f98; stroke-width: 1.2; }
      .blue { fill: #dbe8f7; stroke: #1f5fae; stroke-width: 1.4; }
      .bplain { fill: #ffffff; stroke: #1f5fae; stroke-width: 1.1; }
      .bold { font-size: 13px; font-weight: 700; fill: #2b2f36; text-anchor: middle; }
      .txt { font-size: 11.5px; fill: #3d424a; text-anchor: middle; }
      .small { font-size: 10.5px; fill: #6b7078; text-anchor: middle; }
      .code { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #2b2f36; text-anchor: middle; }
      .ptitle { font-size: 15px; font-weight: 700; fill: #1f5fae; }
      .psub { font-size: 11.5px; fill: #6b7078; }
      .legend { font-size: 12px; fill: #2b2f36; }
      .line { fill: none; stroke: #6b7078; stroke-width: 1.3; }
    </style>
  </defs>

  <rect class="bg" width="1000" height="750"/>

  <text class="title" x="500" y="38">Lizard training pipeline</text>
  <text class="sub" x="500" y="60">Llama-3.2-1B is the teacher · each stage: 2 epochs, AdamW, warmup + cosine learning rate, 8 sequences per step</text>

  <!-- data -->
  <rect class="gray" x="30" y="300" width="160" height="150" rx="10"/>
  <text class="bold" x="110" y="325">Training data</text>
  <text class="txt" x="110" y="347">alpaca-cleaned</text>
  <text class="txt" x="110" y="364">50,000 examples</text>
  <text class="txt" x="110" y="386">instruction format,</text>
  <text class="txt" x="110" y="403">packed into</text>
  <text class="txt" x="110" y="420">2048-token chunks</text>

  <!-- stage 1 -->
  <rect class="lane" x="220" y="90" width="750" height="256" rx="14"/>
  <text class="ptitle" x="240" y="118">Stage 1 · attention distillation</text>
  <text class="psub" x="240" y="136">each Lizard layer learns to copy the output of the teacher's attention layer</text>

  <rect class="gray" x="240" y="160" width="170" height="150" rx="10"/>
  <text class="bold" x="325" y="182">Teacher</text>
  <text class="small" x="325" y="198">Llama-3.2-1B · frozen</text>
  <rect class="plain" x="252" y="208" width="146" height="20" rx="4"/>
  <rect class="plain" x="252" y="234" width="146" height="20" rx="4"/>
  <rect class="plain" x="252" y="280" width="146" height="20" rx="4"/>
  <text class="small" x="325" y="222">attention layer 1</text>
  <text class="small" x="325" y="248">attention layer 2</text>
  <text class="txt" x="325" y="272">⋮</text>
  <text class="small" x="325" y="294">attention layer 16</text>

  <rect class="plain" x="450" y="195" width="130" height="80" rx="10"/>
  <text class="bold" x="515" y="218">per layer i</text>
  <text class="txt" x="515" y="240">input xᵢ</text>
  <text class="txt" x="515" y="259">output yᵢ</text>

  <rect class="blue" x="620" y="160" width="160" height="150" rx="10"/>
  <text class="bold" x="700" y="182">Student</text>
  <text class="small" x="700" y="198">16 separate Lizard layers</text>
  <rect class="bplain" x="632" y="208" width="136" height="20" rx="4"/>
  <rect class="bplain" x="632" y="234" width="136" height="20" rx="4"/>
  <rect class="bplain" x="632" y="280" width="136" height="20" rx="4"/>
  <text class="small" x="700" y="222">Lizard layer 1</text>
  <text class="small" x="700" y="248">Lizard layer 2</text>
  <text class="txt" x="700" y="272">⋮</text>
  <text class="small" x="700" y="294">Lizard layer 16</text>

  <rect class="plain" x="820" y="195" width="130" height="80" rx="10"/>
  <text class="bold" x="885" y="218">loss</text>
  <text class="txt" x="885" y="240">Σ (Lᵢ(xᵢ) − yᵢ)²</text>
  <text class="small" x="885" y="259">over all 16 layers</text>
  <text class="small" x="885" y="298">trains Lizard params only</text>
  <text class="small" x="885" y="313">lr 1e-3</text>

  <rect class="gray" x="455" y="358" width="130" height="34" rx="17"/>
  <text class="code" x="520" y="379">stage1_lizard.pt</text>

  <!-- stage 2 -->
  <rect class="lane" x="220" y="404" width="750" height="216" rx="14"/>
  <text class="ptitle" x="240" y="432">Stage 2 · fine-tune with LoRA</text>
  <text class="psub" x="240" y="600">the whole model predicts the next token; only LoRA and Lizard params change</text>

  <rect class="gray" x="240" y="470" width="160" height="100" rx="10"/>
  <text class="bold" x="320" y="508">Llama-3.2-1B</text>
  <text class="txt" x="320" y="527">fresh copy of the</text>
  <text class="txt" x="320" y="543">original model</text>

  <rect class="blue" x="440" y="470" width="160" height="100" rx="10"/>
  <text class="bold" x="520" y="500">Lizard model</text>
  <text class="txt" x="520" y="521">swap in 16 Lizard</text>
  <text class="txt" x="520" y="538">attention layers,</text>
  <text class="txt" x="520" y="555">load stage 1 params</text>

  <rect class="blue" x="640" y="470" width="150" height="100" rx="10"/>
  <text class="bold" x="715" y="508">add LoRA</text>
  <text class="txt" x="715" y="527">rank 8 on</text>
  <text class="code" x="715" y="545">q, k, v</text>

  <rect class="blue" x="830" y="470" width="120" height="100" rx="10"/>
  <text class="bold" x="890" y="500">train</text>
  <text class="txt" x="890" y="520">LoRA + Lizard</text>
  <text class="txt" x="890" y="537">next-token loss</text>
  <text class="txt" x="890" y="554">lr 5e-4</text>

  <!-- outputs -->
  <rect class="gray" x="725" y="650" width="230" height="38" rx="19"/>
  <text class="code" x="840" y="673">merge LoRA → stage2_model.pt</text>
  <rect class="plain" x="490" y="650" width="205" height="38" rx="10"/>
  <text class="code" x="592.5" y="673">evaluate.py · generate.py</text>

  <!-- arrows (drawn last so nothing covers them) -->
  <path class="line" d="M190 335 H210 V235 H239" marker-end="url(#arrow)"/>
  <path class="line" d="M190 415 H210 V520 H239" marker-end="url(#arrow)"/>

  <path class="line" d="M410 235 H449" marker-end="url(#arrow)"/>
  <text class="small" x="429" y="228">hooks</text>
  <path class="line" d="M580 235 H619" marker-end="url(#arrow)"/>
  <text class="small" x="599" y="228">xᵢ</text>
  <path class="line" d="M780 235 H819" marker-end="url(#arrow)"/>
  <text class="small" x="799" y="228">Lᵢ(xᵢ)</text>
  <path class="line" d="M515 195 V150 H885 V194" marker-end="url(#arrow)"/>
  <text class="small" x="893" y="178" style="text-anchor:start">yᵢ</text>

  <path class="line" d="M700 310 V375 H586" marker-end="url(#arrow)"/>
  <path class="line" d="M520 392 V469" marker-end="url(#arrow)"/>

  <path class="line" d="M400 520 H439" marker-end="url(#arrow)"/>
  <path class="line" d="M600 520 H639" marker-end="url(#arrow)"/>
  <path class="line" d="M790 520 H829" marker-end="url(#arrow)"/>

  <path class="line" d="M890 570 V649" marker-end="url(#arrow)"/>
  <path class="line" d="M725 669 H696" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect class="blue" x="240" y="712" width="14" height="14" rx="3"/>
  <text class="legend" x="262" y="724">new Lizard parts and LoRA (trained)</text>
  <rect class="gray" x="560" y="712" width="14" height="14" rx="3"/>
  <text class="legend" x="582" y="724">Llama weights, data and checkpoints (not trained)</text>
</svg>
